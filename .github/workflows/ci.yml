name: CI

on:
  push:
    branches: [main]
  pull_request:

# Constitution -> Development Workflow & Quality Gates names the required gates:
# type checking, linting, ML-core unit tests, end-to-end tests at mobile and desktop
# viewports, a locale-completeness check, and an accessibility check of the primary
# journey. Every one of them is merge-blocking here. A gate that only warns is not a gate.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Types, lint and locales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Locale completeness (SC-005)
        run: npm run test:i18n

  ml-core:
    name: ML core (deterministic, DOM-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Principle VI: these run in a node environment against committed fixtures with a
      # fixed seed. No camera, no DOM, no network, no backbone download needed.
      - run: npm run test:ml

  bundle:
    name: Initial-route budget (SC-008)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # T119. plan.md's 200 KB is a product requirement, and the constitution treats a
      # regressed performance target as a defect — so it is a gate rather than a note.
      # It also asserts that TensorFlow.js and supabase-js stay lazy, which is the half
      # with teeth: a budget alone gets re-baselined by whoever hits it.
      - run: npm run check:bundle

  database:
    name: Row-level-security contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      # RLS is the entire authorisation model (contracts/database.md), so these 22
      # scenarios are contracts rather than extras.
      - run: npm run test:db

  e2e:
    name: End-to-end, accessibility and no-egress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run fetch:backbone
      # US4 needs a real Supabase. `redeem_invitation` is a SECURITY DEFINER
      # function and the whole invitation state machine lives inside it (R15), so
      # the three refusals and SC-020's rate limit cannot be exercised against a
      # fake. Without this the account scenarios skip, and a skip is not a pass.
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - name: Publish the local keys to the build (baked in by Vite at build time)
        run: |
          supabase status -o env >> "$GITHUB_ENV"
          {
            echo "VITE_SUPABASE_URL=$(supabase status -o json | jq -r .API_URL)"
            echo "VITE_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r .ANON_KEY)"
            echo "VITE_INVITATION_TTL_HOURS=72"
          } >> "$GITHUB_ENV"
      - run: npm run test:e2e
      - name: Accessibility, zero violations (SC-009)
        run: npm run test:a11y
      # T137: this is where SC-010 is established, not T036. It runs the egress
      # watcher across the complete journey and is merge-blocking.
      - name: No image or model bytes leave the device (SC-010, Principle I)
        run: npm run test:network
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  degraded:
    name: No-WebGL fallback (SC-012)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run fetch:backbone
      # Principle IV requires the WASM fallback to be exercised, not merely configured.
      - run: npm run test:e2e:nowebgl
